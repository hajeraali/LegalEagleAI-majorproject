<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Tracking</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; }
        .section { padding: 15px; border: 1px solid #ddd; margin-bottom: 10px; border-radius: 5px; }
        .hidden { display: none; }
        textarea { width: 100%; height: 100px; }
        button { padding: 10px 15px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Case Tracking</h2>
    
    <div class="section">
        <h3>Case Details</h3>
        <p><strong>Client Email:</strong> <span id="client_email"></span></p>
        <p><strong>Lawyer Name:</strong> <span id="lawyer_name"></span></p>
        <p><strong>Appointment Date:</strong> <span id="appointment_date"></span></p>
        <p><strong>Appointment Time:</strong> <span id="appointment_time"></span></p>
        <p><strong>Case Details:</strong> <span id="case_details"></span></p>
    </div>

    <div class="section">
        <h3>Case Updates</h3>
        <p id="case_updates">No updates yet.</p>
        
        <div id="lawyer_section" class="hidden">
            <textarea id="update_text" placeholder="Enter case update..."></textarea>
            <button onclick="updateCase()">Submit Update</button>
        </div>
    </div>

    <div class="section">
        <h3>Fees</h3>
        <p><strong>Paid:</strong> ₹<span id="fees_paid"></span></p>
        <p><strong>Pending:</strong> ₹<span id="fees_pending"></span></p>
    </div>

    <div class="section">
        <h3>Review & Rating</h3>
        <div id="client_section" class="hidden">
            <label for="rating">Rate Lawyer (1-5):</label>
            <input type="number" id="rating" min="1" max="5">
            <br><br>
            <label for="review_text">Write Review (Min 50 words):</label>
            <textarea id="review_text"></textarea>
            <br>
            <button onclick="submitReview()">Submit Review</button>
        </div>
    </div>

    <div class="section">
        <h3>Case Status: <span id="case_status"></span></h3>
        
        <div id="lawyer_close_section" class="hidden">
            <button onclick="requestClosure()">Request Case Closure</button>
        </div>
        
        <div id="admin_section" class="hidden">
            <button onclick="approveClosure()">Approve Case Closure</button>
        </div>
    </div>
</div>

<script>
    let client_email = "{{ session.get('client_email', '') }}";
    let lawyer_name = "{{ session.get('lawyer_name', '') }}";
    let admin_logged_in = "{{ session.get('admin_logged_in', False) }}" === "True";
    let lawyer_logged_in = "{{ session.get('lawyer_logged_in', False) }}" === "True";
    let client_logged_in = "{{ session.get('client_logged_in', False) }}" === "True";

    $(document).ready(function() {
        loadCaseDetails();
    });

    function loadCaseDetails() {
        $.get(`/case/${client_email}`, function(data) {
            $("#client_email").text(data.client_email);
            $("#lawyer_name").text(data.lawyer_name);
            $("#appointment_date").text(data.appointment_date);
            $("#appointment_time").text(data.appointment_time);
            $("#case_details").text(data.case_details);
            $("#case_updates").text(data.case_updates || "No updates yet.");
            $("#fees_paid").text(data.fees_paid);
            $("#fees_pending").text(data.fees_pending);
            $("#case_status").text(data.status);

            // Role-based visibility
            if (lawyer_logged_in) $("#lawyer_section, #lawyer_close_section").removeClass("hidden");
            if (client_logged_in) $("#client_section").removeClass("hidden");
            if (admin_logged_in && data.status === "Pending Closure") $("#admin_section").removeClass("hidden");
        });
    }

    function updateCase() {
        let updateText = $("#update_text").val();
        $.post("/case/update", JSON.stringify({ client_email, case_update: updateText }), function(response) {
            alert(response.message);
            location.reload();
        }, "json");
    }

    function submitReview() {
        let rating = $("#rating").val();
        let reviewText = $("#review_text").val();

        if (reviewText.split(" ").length < 50) {
            alert("Review must be at least 50 words.");
            return;
        }

        $.post("/case/review", JSON.stringify({ rating, review: reviewText }), function(response) {
            alert(response.message);
            location.reload();
        }, "json");
    }

    function requestClosure() {
        $.post("/case/close_request", JSON.stringify({ client_email }), function(response) {
            alert(response.message);
            location.reload();
        }, "json");
    }

    function approveClosure() {
        $.post("/case/close_approve", JSON.stringify({ client_email }), function(response) {
            alert(response.message);
            location.reload();
        }, "json");
    }
</script>

</body>
</html>
