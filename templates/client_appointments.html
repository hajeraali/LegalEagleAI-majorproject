<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Appointments</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body { padding: 20px; }
        .info-card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .appointments-table { margin-top: 30px; }
        .search-bar { margin-bottom: 20px; }
        .action-buttons {
            white-space: nowrap;
        }
        .delete-btn {
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Client Appointments</h2>
        <button class="btn btn-secondary mb-3" onclick="window.history.back()">Back</button>
        
        <div class="client-info info-card">
            <h4>Client Information</h4>
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Name:</strong> <span id="clientName"></span></p>
                    <p><strong>Email:</strong> <span id="clientEmail"></span></p>
                </div>
            </div>
        </div>
        
        <div class="appointments-section">
            <h4>Appointments</h4>
            <div class="search-bar">
                <input type="text" id="appointmentSearch" class="form-control" placeholder="Search appointments...">
                <button class="btn btn-primary mt-2" onclick="searchAppointments()">Search</button>
            </div>
            <div class="table-responsive">
                <table class="table table-striped appointments-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Lawyer Name</th>
                            <th>Lawyer Email</th>
                            <th>Contact</th>
                            <th>Bar Council ID</th>
                            <th>Practice Area</th>
                            <th>Time</th>
                            <th>Case Details</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTable">
                        <!-- Appointments will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Deletion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this appointment?</p>
                    <p><strong>Case Details:</strong> <span id="modalCaseDetails"></span></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        const clientEmail = window.location.pathname.split('/').pop();
        let currentAppointmentId = null;
        const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
        
        $(document).ready(function() {
            loadClientInfo();
            loadAppointments();
            
            // Set up delete confirmation
            $('#confirmDelete').click(function() {
                if (currentAppointmentId) {
                    deleteAppointment(currentAppointmentId);
                }
            });
        });
        
        function loadClientInfo() {
            $.get(`/api/client_info/${clientEmail}`, function(data) {
                const client = data.client;
                $("#clientName").text(client.username || 'N/A');
                $("#clientEmail").text(client.email || 'N/A');
            }).fail(function(error) {
                console.error("Error loading client info:", error);
                alert("Failed to load client information");
            });
        }
        
        function loadAppointments(searchTerm = '') {
            $.get(`/api/client_appointments/${clientEmail}?search=${searchTerm}`, function(data) {
                let html = '';
                data.appointments.forEach(appt => {
                    html += `
                        <tr id="appt-${appt.id}">
                            <td>${appt.appointment_date}</td>
                            <td>${appt.lawyer_name}</td>
                            <td>${appt.lawyer_email || 'N/A'}</td>
                            <td>${appt.lawyer_contact || 'N/A'}</td>
                            <td>${appt.lawyer_barcouncil || 'N/A'}</td>
                            <td>${appt.lawyer_practice_area || 'N/A'}</td>
                            <td>${appt.appointment_time}</td>
                            <td>${appt.case_details}</td>
                            <td class="action-buttons">
                                <button class="btn btn-danger btn-sm delete-btn" 
                                    onclick="showDeleteModal(${appt.id}, '${appt.case_details}')">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });
                $("#appointmentsTable").html(html);
            }).fail(function(error) {
                console.error("Error loading appointments:", error);
                alert("Failed to load appointments");
            });
        }
        
        function showDeleteModal(appointmentId, caseDetails) {
            currentAppointmentId = appointmentId;
            $('#modalCaseDetails').text(caseDetails);
            deleteModal.show();
        }
        
        function deleteAppointment(appointmentId) {
            $.ajax({
                url: '/api/delete_appointment',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ appointment_id: appointmentId }),
                success: function(response) {
                    deleteModal.hide();
                    $(`#appt-${appointmentId}`).remove();
                    alert('Appointment deleted successfully');
                },
                error: function(xhr) {
                    deleteModal.hide();
                    alert('Failed to delete appointment: ' + (xhr.responseJSON?.error || 'Unknown error'));
                }
            });
        }
        
        function searchAppointments() {
            const searchTerm = $("#appointmentSearch").val();
            loadAppointments(searchTerm);
        }
    </script>
</body>
</html>
