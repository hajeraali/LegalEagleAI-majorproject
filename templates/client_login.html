<!DOCTYPE html>
<html lang="en" dir="ltr">
   <head>
      <meta charset="utf-8">
      <title>Client Login</title>
      <link rel="stylesheet" href="{{ url_for('static', filename='css/loginandsignup.css') }}">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
   <script type="module" src="{{ url_for('static', filename='js/firebase_Auth.js') }}"></script>
   </head>
   <body>
      <div class="bg-img" style="background-image: url('static/images/bg.jpg');">
         <div class="content">
            <header>Login as Client</header>
            <form action="#">
               <div class="field">
                  <span class="fa fa-user"></span>
                  <input type="email" required placeholder="Username or Email" id="email">
               </div>
               <div class="field space">
                  <span class="fa fa-lock"></span>
                  <input type="password" class="pass-key" required placeholder="Password" id="password">
                  <span class="show">SHOW</span>
               </div>
               <div class="pass">
                  <a href="#">Forgot Password?</a>
               </div>
               <div class="field">
                  <input id="login" type="submit" value="LOGIN">
               </div>
            </form>
            <div class="login">
               Or login with
            </div>
            <div class="links">
               <div class="facebook">
                  <i class="fab fa-facebook-f"><span>Facebook</span></i>
               </div>
               <div class="instagram">
                  <i class="fab fa-google"><span>Google</span></i>
               </div>
            </div>
            <div class="signup">
               Don't have an account?
               <a href="{{ url_for('client_signup') }}">Signup Now</a>
            </div>
         </div>
      </div>
      <script type="module">
         const pass_field = document.querySelector('.pass-key');
         const showBtn = document.querySelector('.show');
         showBtn.addEventListener('click', function() {
            if (pass_field.type === "password") {
               pass_field.type = "text";
               showBtn.textContent = "HIDE";
               showBtn.style.color = "#3498db";
            } else {
               pass_field.type = "password";
               showBtn.textContent = "SHOW";
               showBtn.style.color = "#222";
            }
         });

         // Import the functions you need from the SDKs you need
         import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
         import { getDatabase, update, ref } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";
         import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

         // Your web app's Firebase configuration
         const firebaseConfig = {
            apiKey: "{{ firebase_api_key }}",
            authDomain: "{{ firebase_auth_domain }}",
            projectId: "{{ firebase_project_id }}",
            storageBucket: "{{ firebase_storage_bucket }}",
            messagingSenderId: "{{ firebase_messaging_sender_id }}",
            appId: "{{ firebase_app_id }}"
         };

         // Initialize Firebase
         const app = initializeApp(firebaseConfig);
         const database = getDatabase(app);
         const auth = getAuth(app);

         document.getElementById('login').addEventListener('click', (e) => {
             e.preventDefault(); // Prevent the form from submitting
             var email = document.getElementById('email').value;
             var password = document.getElementById('password').value;

             signInWithEmailAndPassword(auth, email, password)
                 .then((userCredential) => {
                     // Signed in
                     const user = userCredential.user;
                     const dt = new Date();
                     update(ref(database, 'users/' + user.uid), {
                        last_login: dt
                     });
                     // Redirect to another page after successful login
                     window.location.href = "{{ url_for('afterlogin') }}"; // Change "dashboard.html" to your desired page
                 })
                 .catch((error) => {
                     const errorMessage = error.message;
                     alert(errorMessage);
                 });
         });
      </script>
   </body>
</html>
