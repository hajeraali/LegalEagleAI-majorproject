<!DOCTYPE html>
<html lang="en" dir="ltr">
   <head>
      <meta charset="utf-8">
      <title>Client signup</title>
      <link rel="stylesheet" href="{{ url_for('static', filename='css/loginandsignup.css') }}">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
      
   </head>
   <body>
      <div class="bg-img" style="background-image: url('static/images/bg1.jpg'); background-color: rgba(1, 28, 57,0.6)">
         <div class="content" >
            <header>Signup as Client</header>
            <form action="#">
                <div style="display: flex; justify-content: space-between; width: 100%;">
                    <div class="field">
                        <span class="fa fa-user" style="margin-right: 10px;"></span>
                        <input type="text" id="username" placeholder="UserName">
                    </div>
                </div>
               <div class="field space">
                  <span class="fa fa-envelope"></span>
                  <input type="email" id="email" placeholder="Email">
               </div>
               <div class="field space">
                <span class="fa fa-lock"></span>
                <input type="password" class="pass-key" id="password" required placeholder="Password">
                <span class="show">SHOW</span>
                </div>
               <div class="field space">
                  <span class="fa fa-lock"></span>
                  <input type="password" class="pass-key" required placeholder=" Confirm Password">
                  <span class="show">SHOW</span>
               </div>
               <div class="field space">
                  <input type="submit" id="signup" value="SIGNUP">
               </div>
            </form>
            <div class="login">
               Or Signup with
            </div>
            <div class="links" style="margin-left: 5%; margin-right:5%" >
               <div class="facebook">
                  <i class="fab fa-facebook-f"><span>Facebook</span></i>
               </div>
               <div class="instagram">
                  <i class="fab fa-google"><span>Google</span></i>
               </div>
            </div>
            <div class="signup">
               Already have an account?
               <a href="{{ url_for('client_login') }}">Login Now</a>
            </div>
         </div>
      </div>
      <script type="module" src="{{ url_for('static', filename='js/firebase_Auth.js') }}"></script>
      <script>
         const pass_field = document.querySelector('.pass-key');
         const showBtn = document.querySelector('.show');
         showBtn.addEventListener('click', function(){
          if(pass_field.type === "password"){
            pass_field.type = "text";
            showBtn.textContent = "HIDE";
            showBtn.style.color = "#3498db";
          }else{
            pass_field.type = "password";
            showBtn.textContent = "SHOW";
            showBtn.style.color = "#222";
          }
         });
         const afterloginUrl = "{{ url_for('afterlogin') }}"; 
        </script>
   </body>
</html>
