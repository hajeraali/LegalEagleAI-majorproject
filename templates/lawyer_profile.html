<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lawyer Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body { padding: 20px; }
        .profile-section { margin-bottom: 30px; }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
        .info-card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .appointments-table { margin-top: 30px; }
        .search-bar { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Lawyer Profile</h2>
        <button class="btn btn-secondary mb-3" onclick="window.history.back()">Back</button>
        
        <div class="profile-section">
            <div class="row">
                <div class="col-md-4">
                    <div class="info-card text-center">
                        <img id="profilePic" src="https://via.placeholder.com/150" class="profile-pic">
                        <h3 id="lawyerName"></h3>
                        <p id="lawyerEmail"></p>
                        <p><strong>Bar Council ID:</strong> <span id="barCouncilID"></span></p>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="info-card">
                        <h4>Professional Details</h4>
                        <div class="row">
                            <div class="col-md-6">
                                <p><strong>Practice Area:</strong> <span id="practiceArea"></span></p>
                                <p><strong>Firm Name:</strong> <span id="firmName"></span></p>
                                <p><strong>Firm Size:</strong> <span id="firmSize"></span></p>
                                <p><strong>Designation:</strong> <span id="designation"></span></p>
                                <p><strong>Experience:</strong> <span id="experience"></span> years</p>
                            </div>
                            <div class="col-md-6">
                                <p><strong>Total Cases:</strong> <span id="totalCases"></span></p>
                                <p><strong>Successful Cases:</strong> <span id="successfulCases"></span></p>
                                <p><strong>Fees per Hearing:</strong> ₹<span id="fees"></span></p>
                                <p><strong>Location:</strong> <span id="location"></span></p>
                                <p><strong>Contact:</strong> <span id="contact"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="appointments-section">
            <h4>Appointments</h4>
            <div class="search-bar">
                <input type="text" id="appointmentSearch" class="form-control" placeholder="Search appointments...">
                <button class="btn btn-primary mt-2" onclick="searchAppointments()">Search</button>
            </div>
            <div class="table-responsive">
                <table class="table table-striped appointments-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Client Name</th>
                            <th>Client Email</th>
                            <th>Time</th>
                            <th>Case Details</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTable">
                        <!-- Appointments will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        const lawyerId = window.location.pathname.split('/').pop();
        
        $(document).ready(function() {
            loadLawyerProfile();
            loadAppointments();
        });
        
        function loadLawyerProfile() {
            $.get(`/api/lawyer_profile/${lawyerId}`, function(data) {
                const profile = data.profile;
                
                // Basic Info
                $("#lawyerName").text(profile.Lawyer_name || profile.name || 'N/A');
                $("#lawyerEmail").text(profile.email || 'N/A');
                $("#barCouncilID").text(profile.Bar_Council_ID || profile.barCouncilID || 'N/A');
                
                // Professional Details
                $("#practiceArea").text(profile.Practice_area || 'N/A');
                $("#firmName").text(profile.Firm_name || 'N/A');
                $("#firmSize").text(profile.Firm_size || 'N/A');
                $("#designation").text(profile.Designation || 'N/A');
                $("#experience").text(profile.Years_of_Experience || 'N/A');
                $("#totalCases").text(profile.Total_cases || 'N/A');
                $("#successfulCases").text(profile.Successful_cases || 'N/A');
                $("#fees").text(profile.Nominal_fees_per_hearing || 'N/A');
                $("#location").text(profile.Location || 'N/A');
                $("#contact").text(profile.contact || 'N/A');
                
                // Profile Picture
                if (profile.profilePicUrl) {
                    $("#profilePic").attr("src", profile.profilePicUrl);
                }
            }).fail(function(error) {
                console.error("Error loading lawyer profile:", error);
                alert("Failed to load lawyer profile");
            });
        }
        
        function loadAppointments(searchTerm = '') {
            $.get(`/api/lawyer_appointments/${lawyerId}?search=${searchTerm}`, function(data) {
                let html = '';
                data.appointments.forEach(appt => {
                    html += `
                        <tr id="appt-${appt.id}">
                            <td>${appt.appointment_date}</td>
                            <td>${appt.client_name}</td>
                            <td>${appt.client_email}</td>
                            <td>${appt.appointment_time}</td>
                            <td>${appt.case_details}</td>
                            <td>
                                <button class="btn btn-danger btn-sm" onclick="deleteAppointment(${appt.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
                $("#appointmentsTable").html(html);
            }).fail(function(error) {
                console.error("Error loading appointments:", error);
                alert("Failed to load appointments");
            });
        }
        
        function deleteAppointment(appointmentId) {
            if (confirm("Are you sure you want to delete this appointment?")) {
                $.ajax({
                    url: "/api/delete_lawyer_appointment",  // Updated endpoint
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ appointment_id: appointmentId }),
                    success: function(response) {
                        $(`#appt-${appointmentId}`).remove();
                        alert("Appointment deleted successfully!");
                    },
                    error: function(xhr) {
                        alert("Failed to delete appointment: " + (xhr.responseJSON?.error || 'Unknown error'));
                    }
                });
            }
        }
        
        function searchAppointments() {
            const searchTerm = $("#appointmentSearch").val();
            loadAppointments(searchTerm);
        }
    </script>
</body>
</html>
